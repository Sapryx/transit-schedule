services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transit}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgres://transit:${DB_PASSWORD:-transit}@db:5432/transit
      DISPATCHER_LOGIN: ${DISPATCHER_LOGIN:-dispatcher}
      DISPATCHER_PASSWORD: ${DISPATCHER_PASSWORD:-dispatcher}
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      OVERPASS_URL: ${OVERPASS_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./dispatcher-web
    ports:
      - "8088:80"
    depends_on:
      - server

volumes:
  db-data:
